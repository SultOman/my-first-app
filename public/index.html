<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block; margin-bottom: 6px;
            font-weight: 600; color: #555; font-size: 14px;
        }
        input, select {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; outline: none; transition: border-color 0.3s;
        }
        input:focus, select:focus { border-color: #667eea; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        button:active { transform: translateY(0); }
        .message {
            margin-top: 20px; padding: 15px;
            border-radius: 10px; text-align: center;
            font-weight: 600; display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error   { background: #f8d7da; color: #721c24; display: block; }
        .hr-link {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: #888;
        }
        .hr-link a { color: #667eea; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h1>📝 Employee Information</h1>
    <p class="subtitle">Fill in your details — HR will review soon!</p>

    <div class="form-group">
        <label>👤 Full Name</label>
        <input type="text" id="name" placeholder="e.g. Ahmed Al Balushi">
    </div>

    <div class="form-group">
        <label>🏢 Department</label>
        <select id="department">
            <option value="">-- Choose Department --</option>
            <option value="IT">💻 Information Technology</option>
            <option value="Finance">💰 Finance</option>
            <option value="HR">👥 Human Resources</option>
            <option value="Operations">⚙️ Operations</option>
            <option value="Legal">⚖️ Legal</option>
        </select>
    </div>

    <div class="form-group">
        <label>💼 Position / Job Title</label>
        <input type="text" id="position" placeholder="e.g. Systems Analyst">
    </div>

    <div class="form-group">
        <label>📧 Email Address</label>
        <input type="email" id="email" placeholder="e.g. ahmed@opaz.gov.om">
    </div>

    <div class="form-group">
        <label>📱 Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. +968 9999 9999">
    </div>

    <button onclick="submitForm()">🚀 Submit to HR</button>

    <div id="message" class="message"></div>

    <div class="hr-link">
        Are you HR? <a href="hr-login.html">Go to HR Login →</a>
    </div>
</div>

<script>
    async function submitForm() {
        const name       = document.getElementById('name').value.trim();
        const department = document.getElementById('department').value;
        const position   = document.getElementById('position').value.trim();
        const email      = document.getElementById('email').value.trim();
        const phone      = document.getElementById('phone').value.trim();
        const messageDiv = document.getElementById('message');

        // Simple validation
        if (!name || !department || !position || !email || !phone) {
            messageDiv.className = 'message error';
            messageDiv.textContent = 'Please fill in all fields!';
            return;
        }

        try {
            const response = await fetch('http://localhost:4000/submit-employee', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, department, position, email, phone })
            });

            if (!response.ok) {
                throw new Error('Server error: ' + response.status);
            }

            const result = await response.json();

            if (result.success) {
                messageDiv.className = 'message success';
                messageDiv.textContent = result.message + ' Your ID is #' + result.id;
                // Clear form
                document.getElementById('name').value = '';
                document.getElementById('department').value = '';
                document.getElementById('position').value = '';
                document.getElementById('email').value = '';
                document.getElementById('phone').value = '';
            }

        } catch (error) {
            messageDiv.className = 'message error';
            messageDiv.textContent = 'Could not connect to server. Is it running?';
            console.log('Error:', error);
        }
    }
</script>

</body>
</html>
